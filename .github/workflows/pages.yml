name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage publishable site only
        run: |
          set -euo pipefail
          # Defense in depth: only these paths may enter the Pages artifact.
          test -f site/index.html
          test -f site/main.js
          test -f site/styles.css
          test -f site/CNAME
          test -f site/.nojekyll
          # Refuse if ops paths were ever copied into site/
          ! test -e site/scripts
          ! test -e site/docs
          ! test -e site/README.md
          ! test -e site/.github
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
